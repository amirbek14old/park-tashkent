   h("div",{className:"foot"},"Locations are approximate. Statuses are simulated or user-reported. Real sensor and AI camera feeds can be connected later through the ingest function in the code.")),
  h(MapView,{lots,spots:vs,sel,focus,pos,onSpot:id=>{setSel(id);const s=E.find(x=>x.id===id);if(s)goMaps(s)},onLot:pickLot}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script></body></html>
